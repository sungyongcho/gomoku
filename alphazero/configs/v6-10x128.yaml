# v6: a 10x128 network that starts from the games v5 (6x96) played, then goes on with self-play.
# Why: v5 stopped improving. From iteration 116 to 144 neither the ladder (360 games) nor the
# promotion gate separated its checkpoints, and the loss stayed at 2.15. More iterations of the
# same network were not paying, so the last stretch of training goes to a larger one.
# Start: gomoku/scripts/pretrain.py trains this network on v5's replay shards and saves
# ckpt/seed_v5games.pt, which train.py loads as iteration 0. v5's last shards are copied into
# this run's replay directory as iteration 0, so the first iterations train on v5 games mixed
# with v6's own.
# Size: 10x128 has 3.33M weights against 1.36M and its self-play inference (bfloat16, batch 8)
# measured 39 ms against 16 ms on a C4D worker, 2.5 times slower.
# Measure: a larger network must win at equal thinking time, not at equal searches. Every fourth
# iteration the latest model plays v5's iteration 144 with 640 searches against v5's 1600, the
# same 2.5 ratio. Openings are three random stones (white moves first), the most even opening
# found in v5's self-play; see v5-small-6x96-cont8.yaml. The promotion gate cannot separate
# near-equal models in this game, so it runs rarely and the reference match uses the latest model.
# Self-play settings are v5's last ones (v5-small-6x96-cont9.yaml): 800 searches, noise on every
# searched move, 1200 games, replay buffer 500000 with one epoch, random opening cycle 0-4.
# Schedules must end at training.num_iterations, so a further stretch needs its own config.
board:
  num_lines: 19
  enable_doublethree: true
  enable_capture: true
  capture_goal: 5
  gomoku_goal: 5
  history_length: 5

model:
  num_hidden: 128
  num_resblocks: 10

mcts:
  C: 2.0
  num_searches: 800
  fpu_from_parent: true
  fpu_reduction: 0.1 # measured 2026-11-07: 0 leaves targets near uniform, 0.2+ narrows to about 8 moves
  exploration_turns: 16
  dirichlet_epsilon: 0.25
  dirichlet_alpha: 0.03
  batch_infer_size: 8
  min_batch_size: 1
  max_batch_wait_ms: 0
  use_native: true
  resign_enabled: false
  resign_threshold: 0.95
  min_moves_before_resign: 20

training:
  num_iterations: 30
  num_selfplay_iterations: 1200
  num_epochs: 1
  batch_size: 512
  learning_rate: # the seed is already trained; v5 ended at 0.0001
    - { until: 20, value: 0.0003 }
    - { until: 30, value: 0.0001 }
  weight_decay: 0.0001
  temperature: 1.0
  replay_buffer_size: 500000 # about 17 iterations of games
  translation_prob: 0.5 # see v5-small-6x96-cont3.yaml
  min_samples_to_train: 2000
  random_play_ratio: 0.0
  random_opening_turns: [ # cycles every iteration, see v5-small-6x96-cont2.yaml
    { until: 1, value: 0 }, { until: 2, value: 1 }, { until: 3, value: 2 }, { until: 4, value: 3 }, { until: 5, value: 4 },
    { until: 6, value: 0 }, { until: 7, value: 1 }, { until: 8, value: 2 }, { until: 9, value: 3 }, { until: 10, value: 4 },
    { until: 11, value: 0 }, { until: 12, value: 1 }, { until: 13, value: 2 }, { until: 14, value: 3 }, { until: 15, value: 4 },
    { until: 16, value: 0 }, { until: 17, value: 1 }, { until: 18, value: 2 }, { until: 19, value: 3 }, { until: 20, value: 4 },
    { until: 21, value: 0 }, { until: 22, value: 1 }, { until: 23, value: 2 }, { until: 24, value: 3 }, { until: 25, value: 4 },
    { until: 26, value: 0 }, { until: 27, value: 1 }, { until: 28, value: 2 }, { until: 29, value: 3 }, { until: 30, value: 4 }
  ]
  dataloader_num_workers: 4
  use_channels_last: true
  opponent_rates:
    random_bot_ratio: 0.0
    prev_bot_ratio: 0.0

evaluation:
  num_eval_games: 80 # with 40, equal models pass the 55% gate 32% of the time
  eval_every_iters: 5 # see the header
  promotion_win_rate: 0.55
  eval_num_searches: 800 # matches self-play
  eval_random_opening_plies: 3 # white moves first: the most even opening, see v5-small-6x96-cont8.yaml
  eval_opening_turns: 0
  eval_temperature: 0.0
  eval_dirichlet_epsilon: 0.0
  elo_k_factor: 2.0
  initial_blunder_rate: 0.0
  initial_baseline_win_rate: 0.0
  blunder_increase_limit: 1.0
  baseline_wr_min: 0.0
  num_baseline_games: 0
  blunder_threshold: 0.5
  random_play_ratio: 0.0
  use_sprt: false
  reference: # see the header
    name: v5
    checkpoint: gs://gomoku-v5-training/v5-small-6x96/ckpt/iteration_0144.pt
    config: configs/v5-small-6x96-cont9.yaml
    player: latest
    every_iters: 4 # 200 games take about 17 minutes of the whole cluster
    num_games: 200
    num_searches: 640
    reference_searches: 1600
    opening_plies: 3

runtime:
  selfplay:
    actor_num_cpus: 1.0
    inflight_per_actor: 192
    games_per_actor: 80
    max_chunk_size: 1
    gpu_workers: 13 # head: 16 vCPU = 13 workers + driver; local inference needs no inference actors
    gpu_worker_gpu_total: 0.95
  inference:
    actor_num_gpus: 0.05
    num_actors: 0 # ignored with use_local_inference: the runner creates no inference actors
    actor_num_cpus: 1.0
    use_local_inference: true
    local_dtype: bfloat16
  evaluation:
    num_workers: 40 # 80 games: each worker plays two opening pairs

paths:
  use_gcs: true
  run_prefix: "gomoku-v5-training"
  run_id: "v6-10x128"

parallel:
  ray_local_num_workers: 84 # CPU worker slots: 9 C4D x 8 + C4 8 + C4 4 (cluster_v5.yaml)
  mp_num_workers: 1
  num_parallel_games: 1

io:
  max_samples_per_shard: null
  local_replay_cache: /tmp/gmk_replay_cache

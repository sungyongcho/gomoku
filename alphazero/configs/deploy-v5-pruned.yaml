# Serving configuration for the v5 network (6x96) with its unused channels cut out.
# v5 iteration 144 had 136 of its 576 residual-block channels driven to zero by weight decay.
# scripts/prune_channels.py removes them: the outputs stay the same to within 5e-6 and the
# residual blocks do 76% of the multiply-adds. It goes with the checkpoint that script wrote,
# not with the checkpoint as trained (use deploy-v5.yaml for that one).
# Only board, model and mcts are read by the server; the rest satisfies config validation.
# The search stops on time (2.5 s for the 3-second move target), so the network size only
# changes how many searches fit: on the two Neoverse-N1 cores of the Oracle A1 instance,
# with static int8 inference, 6x96 completes about 630 and 10x128 about 270.
board:
  num_lines: 19
  enable_doublethree: true
  enable_capture: true
  capture_goal: 5
  gomoku_goal: 5
  history_length: 5

model:
  num_hidden: 96
  num_resblocks: 6
  resblock_mid_channels: [81, 77, 84, 74, 65, 59] # from scripts/prune_channels.py, see the header

mcts:
  C: 2.0
  num_searches: 100000 # the time limit ends the search
  time_limit_s: 2.5 # stop searching in time for the 3-second move target
  # Keep each connection's search tree between moves: when the next request is the position
  # the tree expects (its root, or one move below it), the search goes on from that subtree.
  reuse_tree: true
  # Search the position after the engine's move while the opponent thinks (needs reuse_tree).
  # A move request stops it first, so the timed search keeps both cores: measured on the A1
  # instance, answers stayed at 2.51 s (max 2.53 s) and the new searches per move did not drop.
  ponder: true
  ponder_max_nodes: 50000 # all kept trees together; 4 to 5 KB a node, so about 250 MB
  ponder_time_limit_s: 120 # a connection left open stops using the processor after this
  fpu_from_parent: true
  fpu_reduction: 0.1 # the value this network was trained and matched with
  exploration_turns: 0
  dirichlet_epsilon: 0.0
  dirichlet_alpha: 0
  batch_infer_size: 1
  min_batch_size: 1
  max_batch_wait_ms: 0
  use_native: true # Use native C++ MCTS; server reconstructs native_state from frontend payload.
  resign_threshold: 0.95
  resign_enabled: true
  min_moves_before_resign: 20

# Valid dummy values to satisfy RootConfig validation
training:
  num_iterations: 1
  num_selfplay_iterations: 1
  num_epochs: 1
  batch_size: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  temperature: 1.0
  replay_buffer_size: 10
  min_samples_to_train: 1

evaluation:
  num_eval_games: 0
  eval_every_iters: 1
  promotion_win_rate: 0.55
  num_baseline_games: 0
  blunder_threshold: 0.1
  initial_blunder_rate: 0
  initial_baseline_win_rate: 0
  blunder_increase_limit: 0
  baseline_wr_min: 0
  random_play_ratio: 0.0

parallel:
  num_parallel_games: 1
  mp_num_workers: 1
  ray_local_num_workers: 1

paths:
  use_gcs: false
  run_prefix: "deploy"
  run_id: "deploy-v5-pruned"

io:
  initial_replay_shards: 1
  initial_replay_iters: 1
  max_samples_per_shard: 1
  local_replay_cache: "/tmp/replay"
